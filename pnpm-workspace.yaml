packages:
  - 'packages/*'
# pnpm 11 key — silently ignored by pnpm 10
allowBuilds:
  '@modelcontextprotocol/inspector': false
  '@swc/core': true
  core-js: true
  esbuild: true
  node-pty: true
  nx: true
  sharp: true
minimumReleaseAgeExclude:
  - '@nx/devkit@23.2.0'
  - '@nx/eslint@23.2.0'
  - '@nx/js@23.2.0'
  - '@nx/nx-darwin-arm64@23.2.0'
  - '@nx/nx-darwin-x64@23.2.0'
  - '@nx/nx-freebsd-x64@23.2.0'
  - '@nx/nx-linux-arm-gnueabihf@23.2.0'
  - '@nx/nx-linux-arm64-gnu@23.2.0'
  - '@nx/nx-linux-arm64-musl@23.2.0'
  - '@nx/nx-linux-x64-gnu@23.2.0'
  - '@nx/nx-linux-x64-musl@23.2.0'
  - '@nx/nx-win32-arm64-msvc@23.2.0'
  - '@nx/nx-win32-x64-msvc@23.2.0'
  - '@nx/playwright@23.2.0'
  - '@nx/react@23.2.0'
  - '@nx/vite@23.2.0'
  - '@nx/vitest@23.2.0'
  - '@nx/web@23.2.0'
  - '@nx/workspace@23.2.0'
  - nx@23.2.0
# pnpm 10 key — silently ignored by pnpm 11
onlyBuiltDependencies:
  - '@swc/core'
  - core-js
  - esbuild
  - node-pty
  - nx
  - sharp
overrides:
  hono@<4.12.4: ^4.12.4
  '@hono/node-server@<1.19.10': ^1.19.10
  express-rate-limit@>=8.0.0 <8.2.2: ^8.2.2
  rollup@4: ^4.59.0
  svgo@3: ^3.3.3
  koa@3: ^3.1.2
  minimatch@3: ^3.1.4
  lodash@<4.18.0: ^4.18.0
  tmp@<0.2.6: ^0.2.6
