version: 2
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/nx-plugin'
    schedule:
      interval: 'weekly'
    allow:
      - dependency-type: "all"
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
