name: Update Versions

on:
  schedule:
    # Run every Monday at 7:00 AM Sydney time (9:00 PM UTC Sunday)
    - cron: '0 21 * * 0'
  workflow_dispatch: # Allow manual triggering

env:
  CI: 'true'
  NX_DAEMON: 'true'

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  update_versions:
    name: Update Versions
    runs-on: codebuild-nx-plugin-for-aws-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.UPDATE_VERSIONS_GITHUB_TOKEN }}
      - uses: ./.github/actions/init-monorepo
        with:
          aws-docker-login-role-arn: ${{ secrets.AWS_DOCKER_LOGIN_ROLE_ARN }}
      - name: Bump Nx Plugin for AWS versions
        run: |
          pnpm i
          # Record the release that shipped each migration, so source converges
          # on the versions of everything already released and the release only
          # has to resolve entries that are still unversioned.
          #
          # Runs BEFORE the bump: a release that published since the last run left
          # source's entry still reading `latest`, and registering a newer nx bump
          # drops whatever is still pending. Dating that entry first means the bump
          # supersedes only what has genuinely never shipped, so a workspace on the
          # released version still gets its hop.
          pnpm exec tsx ./scripts/backfill-migration-versions.ts
          pnpm exec tsx ./scripts/update-versions.ts
          # update-versions.ts writes this repo's manifests too, so refresh the
          # lockfile and node_modules before anything builds against them.
          pnpm i --no-frozen-lockfile
          pnpm nx reset
          pnpm nx test nx-plugin -u
          pnpm lint
          pnpm nx generate-3p-license nx-plugin
          git add .
          pnpm lint-staged
      - name: Read version update report
        id: report
        run: |
          REPORT=$(cat dist/scripts/update-versions/report.txt)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.UPDATE_VERSIONS_GITHUB_TOKEN }}
          commit-message: |
            feat: update dependencies

            ${{ steps.report.outputs.content }}
          title: 'feat: update dependencies'
          body: |
            ## Dependency Updates

            ${{ steps.report.outputs.content }}
          branch: version-update-${{ github.run_id }}
          delete-branch: true
