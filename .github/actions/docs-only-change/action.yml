name: Docs Only Change
description: Work out whether a change touches nothing outside the docs directory, so the smoke tests can be skipped.

outputs:
  docs-only:
    description: '"true" when every changed file is under docs/, otherwise "false".'
    value: ${{ steps.detect.outputs.docs-only }}

runs:
  using: composite
  steps:
    - name: Detect docs only change
      id: detect
      shell: bash
      # Passed as environment variables rather than interpolated into the script.
      env:
        # A pull request checks out a merge commit, so diff the branch head to
        # leave out commits that landed on the base since the branch forked.
        BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail

        # Anything but a pair of commits we hold - a workflow_dispatch run, a new
        # branch, a force push whose previous head is gone - runs everything.
        for sha in "${BASE_SHA:-}" "${HEAD_SHA:-}"; do
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            echo "No commit range to diff - treating as a non-docs change"
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done

        changed=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")

        if [ -z "$changed" ] || echo "$changed" | grep -qv '^docs/'; then
          docs_only=false
        else
          docs_only=true
        fi

        echo "docs-only=${docs_only}" >> "$GITHUB_OUTPUT"
        # Indented so a file name cannot break out of the code block.
        {
          echo "### Docs only change: \`${docs_only}\`"
          echo
          echo "Changed files:"
          echo
          printf '%s\n' "${changed:-<none>}" | sed 's/^/    /'
        } >> "$GITHUB_STEP_SUMMARY"
