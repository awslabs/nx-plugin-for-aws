name: Save uv Cache On Failure
description: >-
  Save the uv download cache after a failing step, so the next attempt of this
  job starts from whatever it managed to download. setup-uv saves its own cache
  from a post step declared "post-if: success()", so a job that fails never
  saves one — and the jobs that fail on a PyPI outage are exactly the ones that
  most need a warm cache next time. init-monorepo exports the key and path this
  reads; it cannot save them itself, because a composite action's steps all run
  before the job's test step and so never observe its failure.
  Add as the last step of any job that runs Python tooling, conditioned on the
  job having failed.

runs:
  using: 'composite'
  steps:
    - name: Save uv cache
      # UV_FAILED_CACHE_KEY is unset when init-monorepo ran without the uv cache.
      if: ${{ env.UV_FAILED_CACHE_KEY != '' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ env.UV_CACHE_PATH }}
        key: ${{ env.UV_FAILED_CACHE_KEY }}
