name: Initialize Monorepo
description: Initialize nx monorepo for CI workflows

inputs:
  aws-docker-login-role-arn:
    description: 'ARN of the AWS role to assume for Docker login'
    required: false
  container-tools:
    description: 'Set up QEMU and Docker Buildx for multi-arch container builds. Disable for jobs that do not build containers.'
    required: false
    default: 'true'
  enable-uv-cache:
    description: 'Enable the uv download cache, so wheels are restored from the Actions cache instead of refetched from PyPI on every job.'
    required: false
    default: 'true'
  setup-bun:
    description: 'Install Bun. Disable for jobs that do not run Bun (e.g. build, docs, unit tests).'
    required: false
    default: 'true'
  setup-uv:
    description: 'Install uv/Python. Disable for jobs that do not run Python tooling.'
    required: false
    default: 'true'
  uv-http-retries:
    description: 'Value for UV_HTTP_RETRIES, applied to every uv invocation in the job. Raised above uv''s default of 3 to ride out intermittent PyPI 5xx responses.'
    required: false
    default: '8'
  uv-cache-suffix:
    description: 'Extra suffix distinguishing this job''s saved uv cache entry from its siblings''. Set to the matrix value in matrix jobs, whose job name alone is identical across legs. Every job restores from the same shared prefix regardless.'
    required: false
    default: ''
  setup-terraform:
    description: 'Install Terraform. Disable for jobs that do not run Terraform.'
    required: false
    default: 'true'
  setup-smithy:
    description: 'Install the Smithy CLI on Windows, where it is a prerequisite rather than resolved by mise. Off by default — only the jobs that build a Smithy project need it. No effect on other runners.'
    required: false
    default: 'false'
  smithy-version:
    description: 'Smithy CLI version to install on Windows. Keep in step with MISE_VERSIONS.smithy in packages/nx-plugin/src/utils/versions.ts.'
    required: false
    default: '1.73.0'

runs:
  using: 'composite'
  steps:
    - name: Raise inotify limits
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      # `local-dev` smoke tests run several watch-mode dev servers in
      # parallel (Vite, tsx --watch, uvicorn/watchfiles), which can exhaust the
      # runner's default inotify limits. Raise them to dev-machine levels. Try
      # as the current user (CodeBuild runs as root) then fall back to sudo.
      run: |
        raise() {
          sysctl -w "$1" 2>/dev/null || sudo sysctl -w "$1" 2>/dev/null || true
        }
        raise fs.inotify.max_user_instances=1024
        raise fs.inotify.max_user_watches=1048576
        echo "max_user_instances=$(cat /proc/sys/fs/inotify/max_user_instances)"
        echo "max_user_watches=$(cat /proc/sys/fs/inotify/max_user_watches)"
    - name: Docker login credentials
      if: ${{ inputs.aws-docker-login-role-arn != '' }}
      uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
      with:
        role-to-assume: ${{ inputs.aws-docker-login-role-arn }}
        aws-region: us-east-1
    - name: Login to ECR
      if: ${{ inputs.aws-docker-login-role-arn != '' }}
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: public.ecr.aws
    - name: Use PNPM
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      if: ${{ runner.os != 'Windows' && inputs.setup-bun == 'true' }}
      with:
        bun-version: 1.3.6
    - name: Use Node.js 22.x
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        registry-url: 'https://registry.npmjs.org'
    - name: Install the latest version of uv
      if: ${{ inputs.setup-uv == 'true' }}
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        version: 'latest'
        # The cache is managed below rather than by setup-uv, which restores by
        # exact key only. This step still exports UV_CACHE_DIR from
        # `cache-local-path`, which is what the steps below cache.
        enable-cache: 'false'
        # A fixed path rather than the default under `$RUNNER_TEMP`, whose
        # CodeBuild value contains a per-job segment. GitHub derives a cache
        # entry's version from the path it was saved from, so a varying path
        # means a saved entry can never be restored by a later job.
        cache-local-path: ${{ runner.os == 'Windows' && 'C:\uv-cache' || '/tmp/setup-uv-cache' }}
    # One cache shared by every job, rather than one per job. A wheel is
    # identical whichever job downloaded it, so per-job entries stored ~46 near
    # copies of the same packages (4.6GB against a 10GB repo limit) and no job
    # benefited from what the others had already fetched.
    #
    # `restore-keys` is what makes sharing work: the exact key is unique per run
    # so every run saves a fresh entry, and the prefix match then restores the
    # most recent one. Keying by exact match alone would mean the first job to
    # finish saves and every later job gets a hit and skips saving, freezing the
    # cache at whatever that one job happened to download.
    #
    # Branches inherit the default branch's caches, so PR jobs restore what CI
    # on main saved — the cache is shared across runs, workflows and PRs.
    - name: Restore the uv cache
      id: uv-cache
      if: ${{ inputs.setup-uv == 'true' && inputs.enable-uv-cache == 'true' }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.os == 'Windows' && 'C:\uv-cache' || '/tmp/setup-uv-cache' }}
        key: uv-${{ runner.os }}-${{ hashFiles('packages/nx-plugin/src/utils/versions.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}${{ inputs.uv-cache-suffix && format('-{0}', inputs.uv-cache-suffix) || '' }}
        restore-keys: |
          uv-${{ runner.os }}-${{ hashFiles('packages/nx-plugin/src/utils/versions.ts') }}-
          uv-${{ runner.os }}-
    # `enable-cache: false` above also removes setup-uv's post-job save, so the
    # job saves the cache itself via the `save-uv-cache` action. Exported here so
    # that action does not have to recompute the key.
    - name: Export the uv cache key and path
      if: ${{ inputs.setup-uv == 'true' && inputs.enable-uv-cache == 'true' }}
      shell: bash
      run: |
        {
          echo "UV_CACHE_KEY=${{ steps.uv-cache.outputs.cache-primary-key }}"
          echo "UV_CACHE_PATH=${{ runner.os == 'Windows' && 'C:\uv-cache' || '/tmp/setup-uv-cache' }}"
        } >> "$GITHUB_ENV"
    - name: Configure uv retries
      if: ${{ inputs.setup-uv == 'true' }}
      shell: bash
      # Set on the job environment so every `uv` invocation inherits it,
      # including those spawned by Nx targets in generated workspaces.
      run: echo "UV_HTTP_RETRIES=${{ inputs.uv-http-retries }}" >> "$GITHUB_ENV"
    - name: Set up QEMU
      if: ${{ runner.os != 'Windows' && inputs.container-tools == 'true' }}
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      with:
        image: public.ecr.aws/eks-distro-build-tooling/binfmt-misc:qemu-v7.0.0
    - name: Set up Docker Buildx
      if: ${{ runner.os != 'Windows' && inputs.container-tools == 'true' }}
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Cache WSL2 Docker distro (Windows)
      if: ${{ runner.os == 'Windows' && inputs.container-tools == 'true' }}
      id: wsl-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}\wsl-distro\ubuntu-docker.tar
        key: ${{ runner.os }}-wsl-docker-${{ hashFiles('.github/scripts/install-wsl-docker.sh') }}
    - name: Set up WSL2 Docker for Linux builds (Windows)
      if: ${{ runner.os == 'Windows' && inputs.container-tools == 'true' }}
      shell: pwsh
      run: |
        # Windows runners only have Docker in Windows-container mode, so build
        # Linux images in WSL2. The configured distro is cached as an exported
        # tarball; a cache hit imports it instead of re-running the apt install.
        $tarDir = "$env:RUNNER_TEMP\wsl-distro"
        $tar = "$tarDir\ubuntu-docker.tar"
        $installDir = "$env:RUNNER_TEMP\wsl-ubuntu"

        # Helper: convert a repo script to LF and run it in WSL2 as root.
        function Invoke-WslScript($relPath) {
          $script = Get-Content "${{ github.workspace }}/$relPath" -Raw
          $lfScript = $script -replace "`r`n", "`n"
          $tmpScript = "$env:RUNNER_TEMP/$(Split-Path $relPath -Leaf)"
          [System.IO.File]::WriteAllText($tmpScript, $lfScript)
          $wslPath = wsl -d Ubuntu-24.04 wslpath ($tmpScript -replace '\\','/')
          wsl -d Ubuntu-24.04 -u root -- bash $wslPath
          if ($LASTEXITCODE -ne 0) { throw "WSL script $relPath failed with exit code $LASTEXITCODE" }
        }

        if ("${{ steps.wsl-cache.outputs.cache-hit }}" -eq "true") {
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          wsl --import Ubuntu-24.04 $installDir $tar
        } else {
          wsl --install Ubuntu-24.04 --no-launch
          Invoke-WslScript ".github/scripts/install-wsl-docker.sh"
          New-Item -ItemType Directory -Path $tarDir -Force | Out-Null
          # Terminate the distro so the exported tarball is a clean snapshot.
          wsl --terminate Ubuntu-24.04
          wsl --export Ubuntu-24.04 $tar
        }
        wsl --set-default Ubuntu-24.04

        # Start the daemon and select the buildx builder (runs every job).
        Invoke-WslScript ".github/scripts/start-wsl-docker.sh"

        # Install docker.cmd wrapper that forwards to WSL2 Linux daemon
        # See .github/scripts/docker-wsl.cmd for the wrapper logic.
        $wrapperDir = "C:\docker-wsl"
        New-Item -ItemType Directory -Path $wrapperDir -Force | Out-Null
        Copy-Item "${{ github.workspace }}/.github/scripts/docker-wsl.cmd" "$wrapperDir\docker.cmd"
        echo "$wrapperDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        $env:PATH = "$wrapperDir;$env:PATH"

        docker version
        docker buildx ls
    - name: Set up terraform (non-Windows)
      if: ${{ runner.os != 'Windows' && inputs.setup-terraform == 'true' }}
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: '1.15.7'
        terraform_wrapper: false
    - name: Set up terraform (Windows)
      if: ${{ runner.os == 'Windows' && inputs.setup-terraform == 'true' }}
      shell: pwsh
      run: |
        # Install terraform manually on Windows so it lands on a PATH that
        # Nx's run-commands executor (cmd.exe subprocess) can always see.
        # hashicorp/setup-terraform uses GITHUB_PATH which doesn't propagate
        # reliably to Nx executor subprocesses on Windows.
        $version = "1.15.7"
        $tfDir = "C:\terraform"
        New-Item -ItemType Directory -Path $tfDir -Force | Out-Null
        $url = "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_windows_amd64.zip"
        $zip = "$env:RUNNER_TEMP\terraform.zip"
        Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
        Expand-Archive -Path $zip -DestinationPath $tfDir -Force
        echo "$tfDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        $env:PATH = "$tfDir;$env:PATH"
        terraform version
    - name: Set up the Smithy CLI (Windows)
      if: ${{ runner.os == 'Windows' && inputs.setup-smithy == 'true' }}
      shell: pwsh
      run: |
        # Smithy projects build with the Smithy CLI directly rather than in a
        # container. Everywhere else it is resolved on demand by `mise`, a
        # workspace dev dependency — but mise publishes no Windows package to
        # npm, so the CLI is a prerequisite there and CI installs it the same way
        # a user would.
        #
        # Unpacked to a fixed directory rather than installed, so it lands on a
        # PATH that Nx's run-commands executor (a cmd.exe subprocess) can see —
        # the same reason terraform is installed manually above.
        $ErrorActionPreference = "Stop"
        $version = "${{ inputs.smithy-version }}"
        $smithyDir = "C:\smithy"
        $url = "https://github.com/smithy-lang/smithy/releases/download/${version}/smithy-cli-windows-x64.zip"
        $zip = "$env:RUNNER_TEMP\smithy.zip"
        $extract = "$env:RUNNER_TEMP\smithy-extract"
        Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
        # Extracted to its own directory and moved into place, so a re-run cannot
        # nest the payload inside a previous copy.
        Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
        Expand-Archive -Path $zip -DestinationPath $extract -Force
        Remove-Item $smithyDir -Recurse -Force -ErrorAction SilentlyContinue
        Move-Item "$extract\smithy-cli-windows-x64" $smithyDir
        echo "$smithyDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        $env:PATH = "$smithyDir\bin;$env:PATH"
        smithy --version
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      name: Setup pnpm cache
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - name: Update NPM
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: npm i -g npm@11.6.1
    - name: Install Node.js Dependencies
      shell: bash
      run: pnpm i --frozen-lockfile --prefer-offline
    - name: Set git identity
      shell: bash
      run: |-
        git config user.name "release"
        git config user.email "release@github.com"
    - uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4
