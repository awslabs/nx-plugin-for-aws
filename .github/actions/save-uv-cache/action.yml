name: Save uv Cache
description: >-
  Save the uv download cache under this run's unique key, so the next run's
  prefix match picks it up. init-monorepo manages the cache itself rather than
  letting setup-uv do it (setup-uv restores by exact key only, which cannot
  share one cache across jobs), and so has no post-job save of its own.
  Add as the last step of any job that runs Python tooling, and let it run
  whether or not the job succeeded — a job that failed part way through has
  still downloaded packages worth keeping.

runs:
  using: 'composite'
  steps:
    - name: Save uv cache
      # Unset when init-monorepo ran without the uv cache, or with setup-uv off.
      if: ${{ env.UV_CACHE_KEY != '' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ env.UV_CACHE_PATH }}
        key: ${{ env.UV_CACHE_KEY }}
